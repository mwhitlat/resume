<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Matt Whitlatch</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0e; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif; }
canvas { display: block; cursor: pointer; }

#ui { position: fixed; inset: 0; pointer-events: none; }

#hdr {
  position: absolute; top: 24px; left: 80px; right: 32px;
  display: flex; justify-content: space-between; align-items: center;
}
#hdr-name { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #fff; text-transform: uppercase; }
#hdr-count {
  font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.45); text-transform: uppercase;
}
#hdr-count b { color: #fff; display: inline-block; }
#hdr-count b.bump { animation: bump 0.35s ease; }
@keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.6)} 100%{transform:scale(1)} }

#resume-link {
  position: absolute; bottom: 30px; right: 32px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.4); text-decoration: none;
  border: 1px solid rgba(255,255,255,0.15); border-radius: 100px;
  padding: 8px 16px; pointer-events: all; transition: color 0.2s, border-color 0.2s;
}
#resume-link:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

#sound-btn {
  position: absolute; top: 20px; left: 32px;
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; pointer-events: all;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
  transition: background 0.2s; user-select: none;
}
#sound-btn:hover { background: rgba(255,255,255,0.1); }

#card {
  position: absolute; top: 64px; right: 32px; width: 312px;
  background: rgba(14,14,16,0.96);
  border: 1px solid rgba(255,255,255,0.08);
  border-left-width: 3px; border-left-color: #fff;
  border-radius: 10px; padding: 18px 20px;
  opacity: 0; transform: translateX(16px);
  transition: opacity 0.28s ease, transform 0.28s ease;
}
#card.on { opacity: 1; transform: translateX(0); }
#card-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
#card-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 3px; }
#card-sub { font-size: 11px; color: rgba(255,255,255,0.36); margin-bottom: 12px; }
.bl { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.55; margin-bottom: 4px; padding-left: 12px; position: relative; }
.bl::before { content: ''; position: absolute; left: 1px; top: 7px; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.3); }

#intro {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  background: rgba(12,12,14,0.4); opacity: 1; transition: opacity 0.9s ease;
}
#intro.gone { opacity: 0; pointer-events: none; }
#intro-name {
  font-size: 58px; font-weight: 800; letter-spacing: -0.02em; color: #fff;
  opacity: 0; transform: translateY(10px); animation: rise 0.8s ease 0.15s forwards;
}
#intro-sub {
  font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.5); margin-top: 14px;
  opacity: 0; animation: rise 0.8s ease 0.55s forwards;
}
@keyframes rise { to { opacity: 1; transform: translateY(0); } }

#toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.96);
  max-width: 440px; text-align: center; padding: 0 24px;
  font-size: 21px; font-weight: 600; line-height: 1.4; color: #fff;
  opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none;
  text-shadow: 0 2px 24px rgba(0,0,0,0.8);
}
#toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#toast .yr { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 10px; }

#hint {
  position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(255,255,255,0.25); transition: opacity 1s ease;
}

#end {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  background: rgba(12,12,14,0.55);
}
#end.on { opacity: 1; pointer-events: all; }
#end-title { font-size: 52px; font-weight: 800; color: #fff; letter-spacing: -0.02em; margin-bottom: 10px; }
#end-sub { font-size: 15px; color: rgba(255,255,255,0.42); margin-bottom: 34px; line-height: 1.6; }
#end-btn {
  display: inline-block; padding: 13px 32px; background: #fff; color: #000;
  border-radius: 100px; font-size: 13px; font-weight: 600; text-decoration: none;
  letter-spacing: 0.04em; pointer-events: all; transition: opacity 0.2s;
}
#end-btn:hover { opacity: 0.82; }

/* ── Mobile / narrow screens ── */
@media (max-width: 640px) {
  #hdr { top: 18px; left: 64px; right: 16px; }
  #hdr-name { font-size: 11px; letter-spacing: 0.12em; }
  #hdr-count { font-size: 10px; }
  #sound-btn { top: 14px; left: 16px; }

  /* card docks to the bottom as a full-width sheet */
  #card {
    top: auto; bottom: 78px; left: 12px; right: 12px; width: auto;
    border-left-width: 1px; border-top-width: 3px; border-top-color: #fff;
    transform: translateY(16px);
  }
  #card.on { transform: translateY(0); }

  #intro-name { font-size: 34px; }
  #intro-sub { font-size: 11px; padding: 0 24px; }
  #toast { font-size: 17px; max-width: 88vw; }
  #end-title { font-size: 36px; }
  #end-sub { font-size: 13px; padding: 0 24px; }
  #resume-link { bottom: 20px; right: 16px; padding: 9px 14px; }
  #hint { bottom: 22px; font-size: 10px; padding: 0 16px; text-align: center; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hdr">
    <span id="hdr-name">Matt Whitlatch</span>
    <span id="hdr-count"><b id="cnt">0</b> / <span id="tot">0</span> discovered</span>
  </div>
  <div id="card">
    <div id="card-tag"></div>
    <div id="card-title"></div>
    <div id="card-sub"></div>
    <div id="card-blist"></div>
  </div>
  <div id="sound-btn" title="Toggle sound">🔇</div>
  <div id="toast"></div>
  <div id="intro">
    <div id="intro-name">Matt Whitlatch</div>
    <div id="intro-sub">A career, explored — click anywhere to begin</div>
  </div>
  <div id="hint">Click a glowing landmark to travel there</div>
  <a id="resume-link" href="matt-whitlatch-resume.pdf" target="_blank">View PDF résumé</a>
  <div id="end">
    <div id="end-title">Let's talk.</div>
    <div id="end-sub">I turn ambiguity into operating plans that scale.<br>10+ years at Apple &amp; DoorDash.</div>
    <a id="end-btn" href="mailto:mwhitlatch34@gmail.com">mwhitlatch34@gmail.com</a>
  </div>
</div>
<script>
const C = document.getElementById('c');
const cx = C.getContext('2d');
let W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  C.style.width = W + 'px'; C.style.height = H + 'px';
  C.width = Math.round(W * dpr); C.height = Math.round(H * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));

// ── World ─────────────────────────────────────────────────────
const WORLD_W = 3300;
const WORLD_H = () => Math.max(H, 720);
const PLAYER_SPEED = 8.5;
const REACH = 78;            // proximity to trigger a landmark

const DISTRICTS = [
  { x0:    0, x1: 1000, label: 'IOWA STATE',  sub: '2015',          gc: '#c8102e', tint: 'rgba(200,16,46,0.05)',
    voice: 'The foundation. D-I track and a supply-chain degree taught me to compete — and to outwork the problem.', greeted: false },
  { x0: 1100, x1: 2150, label: 'APPLE',       sub: '2019 – 2022',   gc: '#8e8e93', tint: 'rgba(142,142,147,0.05)',
    voice: 'The proving ground. Chip shortage, trade war, a pandemic — I kept the supply chain moving.', greeted: false },
  { x0: 2250, x1: WORLD_W, label: 'DOORDASH', sub: '2022 – Present', gc: '#FF3008', tint: 'rgba(255,48,8,0.05)',
    voice: 'The mandate. I own the growth engine behind the Dashers who keep delivery moving.', greeted: false },
];

// Landmarks: wx/wy world coords, glyph, district color
// wx strictly increases left-to-right so the connecting road never doubles back
const SPOTS = [
  // Iowa State
  { wx: 360,  wy: 0.42, glyph: '🎓', c: '#c8102e', tag: 'Education',  title: 'Iowa State University', sub: 'B.S. Supply Chain Management · May 2015', bul: ['Ames, Iowa'] },
  { wx: 720,  wy: 0.62, glyph: '🏃', c: '#c8102e', tag: 'Athletics',  title: 'NCAA Division I Athlete', sub: 'Track & Field', bul: ['Balanced D-I competition with a full course load'] },
  // Apple
  { wx: 1240, wy: 0.36, glyph: '', c: '#8e8e93', tag: 'Apple · Role', title: 'Business Strategy Manager', sub: 'Oct 2019 – Jul 2022', bul: ['Cross-functional strategy across Eng, IT & Procurement'] },
  { wx: 1450, wy: 0.62, glyph: '🔧', c: '#8e8e93', tag: 'Apple',       title: 'Global Chip Shortage', sub: 'Silicon wafer demand forecasting', bul: ['Aligned stakeholders on process & app requirements'] },
  { wx: 1660, wy: 0.34, glyph: '🧪', c: '#8e8e93', tag: 'Apple',       title: 'COVID-19 Test Kits', sub: '$XXM Copan Diagnostics investment', bul: ['Added >XM weekly US production capacity'] },
  { wx: 1870, wy: 0.62, glyph: '🌐', c: '#8e8e93', tag: 'Apple',       title: 'US–China Trade War', sub: 'Supply chain diversification', bul: ['Gave C-suite & BoD transparency for tariff mitigation'] },
  { wx: 2060, wy: 0.40, glyph: '🤝', c: '#8e8e93', tag: 'Apple',       title: '>$XXXM in Value', sub: 'New manufacturing partnerships', bul: ['Negotiated master-level agreements with new partners'] },
  // DoorDash
  { wx: 2440, wy: 0.36, glyph: '🚗', c: '#FF3008', tag: 'DoorDash · Role', title: 'Sr. Manager, Strategy & Ops', sub: 'Dasher Growth · Jul 2022 – Present', bul: ['Owns New Dasher supply — speed & quality on platform'] },
  { wx: 2640, wy: 0.62, glyph: '📈', c: '#FF3008', tag: 'DoorDash',  title: '$XXXM P&L', sub: 'Planning, management & execution', bul: ['Drove fastest & highest quality growth — Q1 2025'] },
  { wx: 2840, wy: 0.34, glyph: '💸', c: '#FF3008', tag: 'DoorDash',  title: '15% Cost Reduction', sub: '$XXM saved in Dasher advertising', bul: ['Built 0→1 retention strategy, launched in app'] },
  { wx: 3040, wy: 0.62, glyph: '🛡️', c: '#FF3008', tag: 'DoorDash',  title: 'Authenticity Program', sub: 'Risk management initiative', bul: ['Removed >XXXk low-quality accounts; secured $XXM P&L'] },
  { wx: 3220, wy: 0.40, glyph: '🌱', c: '#FF3008', tag: 'Leadership', title: 'Diversity & Inclusion Chair', sub: 'Apple · Community Outreach', bul: ['YearUp: 50+ hrs mentorship to 100+ students'] },
];
SPOTS.forEach(s => s.found = false);
document.getElementById('tot').textContent = SPOTS.length;

// ── State ─────────────────────────────────────────────────────
const player = { x: 180, y: 0, tx: 180, ty: 0 };
player.y = player.ty = WORLD_H() * 0.5;
let camX = 0, camY = 0;
let frame = 0;
let found = 0;
let hintLive = true;
let cardTimer = null;
let ended = false;
let lastInteract = Date.now();
let nextAutoTime = 0;
const IDLE_MS = 6000;
const pops = [];           // discovery burst effects
const confetti = [];       // finish-moment particles

// ── Audio (synthesized, muted by default) ────────────────────
let actx = null, soundOn = false, pad = null, lastStep = 0;
function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function blip(freq, dur, type, vol, delay) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sChime = () => { blip(660, 0.18, 'sine', 0.16, 0); blip(990, 0.30, 'sine', 0.12, 0.07); };
const sStep  = () => blip(150, 0.05, 'triangle', 0.05, 0);
const sFinish = () => [523, 659, 784, 1046, 1318].forEach((f, i) => blip(f, 0.55, 'sine', 0.15, i * 0.11));
function startPad() {
  if (pad || !actx) return;
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = 98; o2.type = 'sine'; o2.frequency.value = 98.7;
  g.gain.value = 0; g.gain.linearRampToValueAtTime(0.035, actx.currentTime + 2.5);
  o.connect(g); o2.connect(g); g.connect(actx.destination);
  o.start(); o2.start(); pad = { o, o2, g };
}
function stopPad() {
  if (!pad) return;
  const p = pad; p.g.gain.linearRampToValueAtTime(0, actx.currentTime + 0.4);
  setTimeout(() => { try { p.o.stop(); p.o2.stop(); } catch (e) {} }, 500); pad = null;
}
const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn) { ensureAudio(); startPad(); soundBtn.textContent = '🔊'; }
  else { stopPad(); soundBtn.textContent = '🔇'; }
});

// intro cold-open
let introActive = true;
const introStart = Date.now();
let toastTimer = null;
function centerToCamX(c) { return Math.max(0, Math.min(WORLD_W - W, c - W / 2)); }
function ease(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
function endIntro() {
  if (!introActive) return;
  introActive = false;
  document.getElementById('intro').classList.add('gone');
  lastInteract = Date.now();
}
function showToast(d) {
  const el = document.getElementById('toast');
  el.innerHTML = '<span class="yr" style="color:' + d.gc + '">' + d.label + ' · ' + d.sub + '</span>' + d.voice;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 4200);
}

// ── Input ─────────────────────────────────────────────────────
function moveTo(sx, sy) {
  const wx = sx + camX, wy = sy + camY, wh = WORLD_H();
  // only respond when a landmark is clicked
  let target = null, best = 46;   // click hit radius around a tile
  SPOTS.forEach(s => {
    const d = dist(wx, wy, s.wx, s.wy * wh);
    if (d < best) { best = d; target = s; }
  });
  if (!target) return;
  player.tx = target.wx;
  player.ty = target.wy * wh;
  lastInteract = Date.now();
  if (hintLive) { document.getElementById('hint').style.opacity = '0'; hintLive = false; }
}
C.addEventListener('click', e => { if (introActive) { endIntro(); return; } moveTo(e.clientX, e.clientY); });
C.addEventListener('touchstart', e => {
  e.preventDefault();
  if (introActive) { endIntro(); return; }
  const t = e.touches[0];
  moveTo(t.clientX, t.clientY);
}, { passive: false });

// ── Card UI ───────────────────────────────────────────────────
function showCard(s) {
  const el = document.getElementById('card');
  el.style.borderLeftColor = s.c;
  el.style.borderTopColor = s.c;
  document.getElementById('card-tag').textContent   = s.tag;
  document.getElementById('card-title').textContent = s.title;
  document.getElementById('card-sub').textContent   = s.sub;
  const bl = document.getElementById('card-blist');
  bl.innerHTML = '';
  s.bul.forEach(b => { const d = document.createElement('div'); d.className = 'bl'; d.textContent = b; bl.appendChild(d); });
  el.classList.add('on');
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => el.classList.remove('on'), 6000);
}

function roundRect(x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}

// ── Draw ──────────────────────────────────────────────────────
function draw() {
  const wh = WORLD_H();
  cx.clearRect(0, 0, W, H);

  // base
  cx.fillStyle = '#0c0c0e';
  cx.fillRect(0, 0, W, H);

  // district tints + dividers + labels
  DISTRICTS.forEach(d => {
    const x = d.x0 - camX;
    const w = d.x1 - d.x0;
    cx.fillStyle = d.tint;
    cx.fillRect(x, -camY, w, wh);
    // divider
    if (d.x0 > 0) {
      cx.strokeStyle = 'rgba(255,255,255,0.06)';
      cx.lineWidth = 1; cx.setLineDash([4, 12]);
      cx.beginPath(); cx.moveTo(x - 50, 0); cx.lineTo(x - 50, H); cx.stroke();
      cx.setLineDash([]);
    }
    // big faint label
    cx.save();
    cx.globalAlpha = 0.06;
    cx.fillStyle = '#fff';
    cx.font = '800 ' + Math.min(76, Math.max(40, W * 0.16)) + 'px -apple-system, sans-serif';
    cx.textAlign = 'center';
    cx.fillText(d.label, d.x0 + w / 2 - camX, 150 - camY);
    cx.restore();
    // small district tag
    cx.fillStyle = d.gc;
    cx.globalAlpha = 0.85;
    cx.font = '700 11px -apple-system, sans-serif';
    cx.textAlign = 'center';
    cx.fillText(d.label + '  ·  ' + d.sub, d.x0 + w / 2 - camX, 180 - camY);
    cx.globalAlpha = 1;
  });

  // path connecting landmarks (subtle road)
  cx.strokeStyle = 'rgba(255,255,255,0.05)';
  cx.lineWidth = 22;
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.beginPath();
  SPOTS.forEach((s, i) => {
    const px = s.wx - camX, py = s.wy * wh - camY;
    i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
  });
  cx.stroke();

  // landmarks
  SPOTS.forEach(s => {
    const px = s.wx - camX, py = s.wy * wh - camY;
    if (px < -120 || px > W + 120) return;
    const pulse = 1 + Math.sin(frame * 0.06 + s.wx) * 0.06;

    // glow ring (stronger if undiscovered)
    const ringR = 30 * (s.found ? 1 : pulse);
    const g = cx.createRadialGradient(px, py, 0, px, py, ringR * 1.8);
    g.addColorStop(0, s.c + (s.found ? '22' : '4d'));
    g.addColorStop(1, 'transparent');
    cx.beginPath(); cx.arc(px, py, ringR * 1.8, 0, Math.PI * 2);
    cx.fillStyle = g; cx.fill();

    // building tile
    const size = 44;
    roundRect(px - size/2, py - size/2, size, size, 10);
    cx.fillStyle = s.found ? 'rgba(30,30,34,0.95)' : 'rgba(22,22,26,0.95)';
    cx.fill();
    cx.lineWidth = 1.5;
    cx.strokeStyle = s.found ? s.c : 'rgba(255,255,255,0.16)';
    cx.stroke();

    // glyph
    cx.font = '22px -apple-system, sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(s.glyph || '🏢', px, py + 1);
    cx.textBaseline = 'alphabetic';

    // label below
    cx.font = (s.found ? '700 ' : '600 ') + '11px -apple-system, sans-serif';
    cx.fillStyle = s.found ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
    cx.textAlign = 'center';
    cx.fillText(s.title, px, py + size/2 + 16);

    // checkmark when found
    if (s.found) {
      cx.beginPath(); cx.arc(px + size/2 - 4, py - size/2 + 4, 7, 0, Math.PI*2);
      cx.fillStyle = s.c; cx.fill();
      cx.strokeStyle = '#fff'; cx.lineWidth = 1.6;
      cx.beginPath();
      cx.moveTo(px + size/2 - 7, py - size/2 + 4);
      cx.lineTo(px + size/2 - 5, py - size/2 + 6.5);
      cx.lineTo(px + size/2 - 1, py - size/2 + 1.5);
      cx.stroke();
    }
  });

  // guided pointer: bouncing chevron over the next undiscovered landmark
  const next = SPOTS.find(s => !s.found);
  if (next) {
    const nx = next.wx - camX, ny = next.wy * wh - camY;
    const by = Math.abs(Math.sin(frame * 0.08)) * 7;
    cx.save();
    cx.globalAlpha = 0.9;
    cx.strokeStyle = next.c; cx.lineWidth = 3; cx.lineCap = 'round';
    const ay = ny - 44 - by;
    cx.beginPath();
    cx.moveTo(nx - 8, ay); cx.lineTo(nx, ay + 8); cx.lineTo(nx + 8, ay);
    cx.stroke();
    cx.restore();
  }

  // discovery pops: expanding ring
  pops.forEach(p => {
    const t = p.age / 28;
    const r = 20 + t * 46;
    cx.save();
    cx.globalAlpha = (1 - t) * 0.8;
    cx.strokeStyle = p.c; cx.lineWidth = 3 * (1 - t);
    cx.beginPath(); cx.arc(p.wx - camX, p.wy - camY, r, 0, Math.PI * 2); cx.stroke();
    cx.restore();
  });

  // player shadow + body
  const ppx = player.x - camX, ppy = player.y - camY;
  cx.beginPath(); cx.ellipse(ppx, ppy + 14, 12, 4, 0, 0, Math.PI*2);
  cx.fillStyle = 'rgba(0,0,0,0.35)'; cx.fill();
  const bob = Math.sin(frame * 0.18) * (dist(player.x, player.y, player.tx, player.ty) > 4 ? 2.5 : 0.6);
  const gx = cx.createRadialGradient(ppx, ppy, 0, ppx, ppy, 30);
  gx.addColorStop(0, 'rgba(255,255,255,0.18)'); gx.addColorStop(1, 'transparent');
  cx.beginPath(); cx.arc(ppx, ppy - bob, 30, 0, Math.PI*2); cx.fillStyle = gx; cx.fill();
  cx.beginPath(); cx.arc(ppx, ppy - bob, 13, 0, Math.PI*2);
  cx.fillStyle = '#fff'; cx.fill();

  // confetti (screen-space, on top)
  confetti.forEach(p => {
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.fillStyle = p.c;
    cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
    cx.restore();
  });
}

function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function spawnConfetti() {
  const cols = ['#c8102e', '#8e8e93', '#FF3008', '#ffffff', '#ffd23f'];
  for (let i = 0; i < 90; i++) {
    confetti.push({
      x: W * (0.2 + Math.random() * 0.6), y: -20 - Math.random() * 80,
      vx: (Math.random() - 0.5) * 6, vy: Math.random() * 2 + 1,
      r: 3 + Math.random() * 5, c: cols[(Math.random() * cols.length) | 0],
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
    });
  }
}

// ── Update ────────────────────────────────────────────────────
function update() {
  frame++;
  const wh = WORLD_H();

  // move player toward target
  const d = dist(player.x, player.y, player.tx, player.ty);
  if (d > 2) {
    player.x += (player.tx - player.x) / d * Math.min(PLAYER_SPEED, d);
    player.y += (player.ty - player.y) / d * Math.min(PLAYER_SPEED, d);
    if (frame - lastStep > 9) { lastStep = frame; sStep(); }
  }

  // camera: scripted pan during intro, follow otherwise
  const camFollow = Math.max(0, Math.min(WORLD_W - W, player.x - W * 0.42));
  if (introActive) {
    const e = Date.now() - introStart;
    const camA = centerToCamX(500), camB = centerToCamX(2750);
    if (e < 600)       camX = camA;
    else if (e < 2000) camX = camA + (camB - camA) * ease((e - 600) / 1400);
    else if (e < 2900) camX = camB + (camFollow - camB) * ease((e - 2000) / 900);
    else { camX = camFollow; endIntro(); }
  } else {
    camX = camFollow;
  }
  camY = wh <= H ? -(H - wh) / 2 : Math.max(0, Math.min(wh - H, player.y - H * 0.5));

  // per-district voice: greet on first entry
  if (!introActive) {
    const di = DISTRICTS.findIndex(d => player.x >= d.x0 && player.x <= d.x1);
    if (di >= 0 && !DISTRICTS[di].greeted) { DISTRICTS[di].greeted = true; showToast(DISTRICTS[di]); }
  }

  // proximity discovery
  SPOTS.forEach(s => {
    const sy = s.wy * wh;
    if (dist(player.x, player.y, s.wx, sy) < REACH) {
      if (!s.found) {
        s.found = true; found++;
        const cntEl = document.getElementById('cnt');
        cntEl.textContent = found;
        cntEl.classList.remove('bump'); void cntEl.offsetWidth; cntEl.classList.add('bump');
        pops.push({ wx: s.wx, wy: sy, c: s.c, age: 0 });
        sChime();
      }
      showCardIf(s);
    }
  });

  // idle auto-walk: after inactivity, drift to the next undiscovered landmark
  const now = Date.now();
  if (!ended && now - lastInteract > IDLE_MS) {
    const atRest = dist(player.x, player.y, player.tx, player.ty) < 3;
    if (atRest && now >= nextAutoTime) {
      const nxt = SPOTS.find(s => !s.found);
      if (nxt) { player.tx = nxt.wx; player.ty = nxt.wy * wh; nextAutoTime = now + 3400; }
    }
    if (hintLive) { document.getElementById('hint').style.opacity = '0'; hintLive = false; }
  }

  // advance pop effects
  for (let i = pops.length - 1; i >= 0; i--) { if (++pops[i].age > 28) pops.splice(i, 1); }

  // advance confetti
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.vy += 0.16; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.y > H + 30) confetti.splice(i, 1);
  }

  // end when all found — finish moment
  if (found >= SPOTS.length && !ended) {
    ended = true;
    sFinish();
    spawnConfetti();
    const cntEl = document.getElementById('cnt');
    cntEl.classList.remove('bump'); void cntEl.offsetWidth; cntEl.classList.add('bump');
    setTimeout(() => spawnConfetti(), 350);
    setTimeout(() => document.getElementById('end').classList.add('on'), 1100);
  }
}

// only re-show a card when entering a new spot (avoid spamming)
let lastSpot = null;
function showCardIf(s) {
  if (lastSpot === s) return;
  lastSpot = s;
  showCard(s);
}
// clear lastSpot when player leaves all spots so re-entry re-pops
function clearLastSpotIfAway() {
  const wh = WORLD_H();
  if (lastSpot && dist(player.x, player.y, lastSpot.wx, lastSpot.wy * wh) > REACH + 20) lastSpot = null;
}

function loop() {
  update();
  clearLastSpotIfAway();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
